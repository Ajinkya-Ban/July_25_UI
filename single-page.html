<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      .container {
        width: 80%;
        min-height: 100px;
        margin: auto;
        border: 1px solid #000;
        display: flex;
        flex-direction: column;
      }
      .header-menu {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 60px;
        background-color: black;
      }
      .header-menu .header {
        display: flex;
        flex-basis: 50%;
      }
      .header h1 {
        color: white;
      }
      .header-menu .menu {
        display: flex;
        justify-content: flex-end;
        flex-basis: 50%;
      }
      .menu ul {
        display: flex;
        list-style: none;
        gap: 10px;
      }
      .menu ul li a {
        text-decoration: none;
        color: white;
        font-size: 1.2em;
        font-weight: 400;
      }
      #section1 {
        display: flex;
        width: 100%;
        min-height: 700px;
        background-color: lightseagreen;
      }

      #section2 {
        display: flex;
        width: 100%;
        min-height: 700px;
        background-color: lightslategray;
      }
      #section3 {
        display: flex;
        width: 100%;
        min-height: 700px;
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-menu">
        <div class="header">
          <h1>ByteCode</h1>
        </div>
        <div class="menu">
          <ul>
            <li><a href="#section1">Home</a></li>
            <li><a href="#section2">About</a></li>
            <li><a href="#section3">Product</a></li>
            <li><a href="">Menu4</a></li>
            <li><a href="">Menu5</a></li>
          </ul>
        </div>
      </div>
      <div id="section1">
        <h1>Home</h1>
      </div>

      <div id="section2">
        <h1>About</h1>
      </div>

      <div id="section3">
        <h1>Products</h1>
      </div>
    </div>
  </body>
</html>
