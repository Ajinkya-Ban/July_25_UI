<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        width: 600px;
        height: 300px;
        margin: auto;
        position: relative;
      }
      .jerry {
        position: absolute;
        top: 96%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* z-index: 1; */
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="imgs/grass.jpg" />
      <div class="jerry">
        <img src="imgs/Jerry_Mouse.png" width="100px" height="100px" />
      </div>
    </div>
  </body>
</html>
