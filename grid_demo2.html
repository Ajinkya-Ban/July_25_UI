<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .box {
        width: 80%;
        min-height: 100px;
        border: 1px solid #000;
        margin: auto;
        display: grid;
        /* grid-template-columns: 100px auto 100px; */
        /* grid-template-columns: 20% 40% 40%; */
        /* grid-template-columns: min-content 300px 200px; */
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, minmax(150px, auto));
        /* grid-row-gap: 10px;
        grid-column-gap: 10px; */
        gap: 10px;
        /* align-items: stretch;
        justify-items: center; */
        /* place-items: stretch center; */
      }
      .items {
        padding: 10px;
        color: white;
        font-size: 1.2em;
      }
      .item1 {
        background-color: orange;
      }
      .item2 {
        background-color: purple;
      }
      .item3 {
        background-color: crimson;
        /* align-self: center;
        justify-self: center; */
        /* place-self: center center; */
      }
      .item4 {
        background-color: black;
      }
      .item5 {
        background-color: green;
      }
      .item6 {
        background-color: royalblue;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="items item1">div1</div>
      <div class="items item2">div2</div>
      <div class="items item3">div3</div>
      <div class="items item4">div4</div>
      <div class="items item5">div5</div>
      <div class="items item6">div6</div>
    </div>
  </body>
</html>
