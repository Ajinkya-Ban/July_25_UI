<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="./css/layout1.css" />
    <link rel="stylesheet" href="ism/css/my-slider.css" />

  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Byte Code</h1>
      </div>

      <div class="menu">
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
          <li><a href="">Services</a></li>
          <li><a href="">Products</a></li>
          <li><a href="">Contact</a></li>
        </ul>
      </div>
      <div class="slider">
        <div
          class="ism-slider"
          data-transition_type="zoom"
          data-play_type="loop"
          data-interval="10000"
          data-image_fx="zoomrotate"

          <ol>
            <li>

              <!-- <div class="ism-caption ism-caption-0">My slide caption text</div> -->

            <li>

            <li>
              <img src="ism/image/slides/summer-192179_1280.jpg" />
              <!-- <div class="ism-caption ism-caption-0">My slide caption text</div> -->
            </li>
          </ol>
        </div>
      </div>

      <div class="bar-cont-div clearfix">
        <div class="bar">
          <img src="imgs/hiring1.jpg" alt="image" />
        </div>
        <div class="cont">
          <div class="box clearfix">
            <div class="hiring-desc">Hiring</div>
            <div class="hiring-img">Image</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <p>Website maintain by byteCode &copy;2025</p>
      </div>
